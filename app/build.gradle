plugins {
    id 'com.android.application'
}

android {
    namespace 'com.example.screenshotuploader'
    compileSdk 34

    defaultConfig {
        applicationId "com.example.screenshotuploader"
        minSdk 21
        targetSdk 29
        versionCode 3
        versionName "1.2.0"
    }

    // 统一 APK 输出文件名为项目名，便于在 Release 中分发
    applicationVariants.all { variant ->
        variant.outputs.all { output ->
            outputFileName = "ScreenshotUploader.apk"
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'com.google.android.material:material:1.11.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    implementation 'com.qiniu:qiniu-android-sdk:8.11.0'
}
