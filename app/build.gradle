plugins {
    id 'com.android.application'
}

android {
    namespace 'com.frwuc.s3fileuploader'
    compileSdk 34
    // AGP 8.1 默认要 33.0.1，统一跟 compileSdk 对齐到 34
    buildToolsVersion '34.0.0'

    defaultConfig {
        applicationId "com.frwuc.s3fileuploader"
        minSdk 21
        targetSdk 29
        versionCode 8
        versionName "1.6.0"
    }

    // 统一 APK 输出文件名为项目名，便于在 Release 中分发
    applicationVariants.all { variant ->
        variant.outputs.all { output ->
            outputFileName = "s3-fileuploader.apk"
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'com.google.android.material:material:1.11.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    implementation 'com.qiniu:qiniu-android-sdk:8.11.0'

    testImplementation 'junit:junit:4.13.2'
}
