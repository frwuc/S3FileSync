[package]
name = "s3filesync"
version = "1.0.2"
edition = "2021"
description = "S3 兼容对象存储同步工具（Windows 桌面端，Rust 原生 GUI）"
license = "MIT"

[[bin]]
name = "S3FileSync"
path = "src/main.rs"

[dependencies]
eframe = "0.31"
egui = "0.31"
tray-icon = "0.19"
ureq = { version = "2.10", default-features = false, features = ["native-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha1 = "0.10"
hmac = "0.12"
base64 = "0.22"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
rfd = "0.15"
winreg = "0.55"
webbrowser = "1"

[profile.release]
opt-level = 2
lto = "thin"
strip = true
